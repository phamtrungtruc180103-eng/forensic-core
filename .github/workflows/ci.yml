name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python sources
        run: python -m compileall -q backend tests create_admin.py create_users.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JavaScript syntax
        run: node --check frontend/js/dashboard.js

  chaincode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaincode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: chaincode/go.sum

      - name: Test chaincode
        run: go test ./...
